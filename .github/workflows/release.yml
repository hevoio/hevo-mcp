# Runs when a release tag (v<version>) is pushed: builds the wheel and the source package from that commit, signs where they came from (GitHub artifact attestations: anyone can check a file was built
# here, from this tag, with `gh attestation verify <file> --repo hevoio/hevo-mcp`), publishes them with their
# sha256 checksums as a GitHub release, then publishes the package to PyPI.
#
# No secrets: PyPI trusted publishing lets PyPI check this workflow's identity, so no token is stored. One-time
# setup: on PyPI, a (pending) trusted publisher for project hevo-mcp, owner hevoio, repository hevo-mcp,
# workflow release.yml, environment pypi; on GitHub, an environment named pypi (limit it to v* tags and add a
# required reviewer, so every upload is approved). A version uploaded to PyPI can never be replaced.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestations
  attestations: write  # store them

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false  # nothing later in the job needs the token
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: The tag matches the version in every file
        run: |
          uv run python scripts/set_version.py --check
          test "v$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: Tests
        run: uv sync --locked && uv run pytest -q
      - name: Build the wheel and the source package
        run: |
          uv build --sdist --wheel --out-dir dist/pypi
          cp dist/pypi/* dist/
          cd dist && sha256sum hevo_mcp-*.whl hevo_mcp-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/hevo_mcp-*.whl
            dist/hevo_mcp-*.tar.gz
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            dist/hevo_mcp-*.whl
            dist/hevo_mcp-*.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-dist
          path: dist/pypi/

  pypi:
    # Separate job so only the upload step gets the PyPI identity, and so it waits for the environment's approval.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hevo-mcp/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true  # a re-run after a partial upload doesn't fail on the files already there
