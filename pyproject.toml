[project]
name = "hevo-mcp"
version = "1.0.1"
description = "MCP server for Hevo: Edge and Standard pipelines, Destinations, Models, Workflows, team users and OAuth accounts"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [
    { name = "Hevo Data" }
]
requires-python = ">=3.12"
keywords = ["hevo", "mcp", "model-context-protocol", "data-pipelines", "etl", "elt", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
# Exact versions: a customer's install (`uvx --from <wheel>`) then gets exactly the versions this release was
# tested with, never a newer upload. Raise them deliberately, after the tests pass on the new versions.
dependencies = [
    "fastmcp==4.1.4",
    "httpx2==2.16.0",
    "jsonschema==4.26.0",  # request bodies checked against the endpoint schema before approval
    "packaging==26.3",  # environment markers in the shipped constraints.txt (pins.py)
]

[build-system]
requires = ["setuptools>=77", "wheel"]  # 77+ reads the SPDX `license` field
build-backend = "setuptools.build_meta"


[tool.setuptools]
# The hevo-pipelines skill lives in skills/ (where the plugins read it) and ships inside the package as
# hevo_mcp_server.skills, so the server can offer the same files as MCP resources.
packages = ["hevo_mcp_server", "hevo_mcp_server.manifest", "hevo_mcp_server.skills"]
package-dir = { "" = "src", "hevo_mcp_server.skills" = "skills" }

[project.urls]
Homepage = "https://hevodata.com"
Source = "https://github.com/hevoio/hevo-mcp"
Documentation = "https://github.com/hevoio/hevo-mcp#readme"
Issues = "https://github.com/hevoio/hevo-mcp/issues"

[project.scripts]
hevo-mcp = "hevo_mcp_server.main:main"

# The manifest is generated by build_manifest.py from openapi/ and shipped with the package.
[tool.setuptools.package-data]
hevo_mcp_server = ["manifest/endpoints.json", "manifest/*.md", "manifest/*/*/*.json", "constraints.txt"]
"hevo_mcp_server.skills" = ["*/SKILL.md", "*/agents/*.yaml", "*/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# uv rebuilds a local checkout (plugins run `uvx --from <plugin folder>`) only when these files change;
# without the source files here, a changed server with the same version number would keep its old build.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.json" }, { file = "src/**/*.md" },
              { file = "skills/**/*.md" }, { file = "skills/**/*.yaml" }]
